<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cyrax Bridge Mock API</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0b0d12;
        color: #e6e8ee;
        font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      main { width: 100%; max-width: 720px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p.sub { margin: 0 0 24px; color: #8b93a7; font-size: 13px; }
      .card {
        background: #12161f;
        border: 1px solid #232a38;
        border-radius: 12px;
        padding: 18px;
        margin-bottom: 16px;
      }
      label { display: block; font-size: 12px; color: #8b93a7; margin-bottom: 6px; }
      input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #2a3242;
        background: #0b0f16;
        color: #e6e8ee;
        font: inherit;
        margin-bottom: 12px;
      }
      button {
        width: 100%;
        padding: 10px 14px;
        border: 0;
        border-radius: 8px;
        background: #4f7cff;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: .5; cursor: wait; }
      pre {
        margin: 0;
        padding: 14px;
        border-radius: 8px;
        background: #0b0f16;
        border: 1px solid #232a38;
        overflow: auto;
        font-size: 13px;
        min-height: 40px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .row { display: flex; gap: 8px; font-size: 12px; color: #8b93a7; }
      code { color: #9db4ff; }
    </style>
  </head>
  <body>
    <main>
      <h1>Cyrax Bridge Mock API</h1>
      <p class="sub">Serverless endpoint: <code>POST /api/login</code></p>

      <div class="card">
        <label for="keycode">Test keycode</label>
        <input id="keycode" value="CYRAX-PREMIUM-2026" autocomplete="off" />
        <button id="submit">Test Login</button>
      </div>

      <pre id="output">Response akan muncul di sini...</pre>
    </main>

    <script>
      const output = document.getElementById("output");
      const button = document.getElementById("submit");

      button.addEventListener("click", async () => {
        button.disabled = true;
        output.textContent = "Loading...";
        try {
          const body = new URLSearchParams({
            deviceId: "web-test-device",
            keycode: document.getElementById("keycode").value.trim(),
            bit: "64",
          });
          const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body,
          });
          const json = await res.json();
          output.textContent = `HTTP ${res.status}\n\n` + JSON.stringify(json, null, 2);
        } catch (error) {
          output.textContent = "Error: " + error.message;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
